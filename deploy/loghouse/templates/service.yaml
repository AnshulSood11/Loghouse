apiVersion: v1
kind: Service
metadata:
  name: {{ include "loghouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loghouse.labels" . | nindent 4 }}
spec:
  type: NodePort
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: {{ .Values.rpcPort }}
      targetPort: {{ .Values.rpcPort }}
    - name: serf-tcp
      protocol: "TCP"
      port: {{ .Values.serfPort }}
      targetPort: {{ .Values.serfPort }}
    - name: serf-udp
      protocol: "UDP"
      port: {{ .Values.serfPort }}
      targetPort: {{ .Values.serfPort }}
  selector:
    {{- include "loghouse.selectorLabels" . | nindent 4 }}
